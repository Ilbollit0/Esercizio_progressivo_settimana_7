<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-libreria — Settimana VII Giorno IV</title>
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>

    <header class="site-header">
      <div class="header-row">
        <div>
          <h1>La mia libreria</h1>
          <p>Aggiungi i tuoi libri e segnali come letti.</p>
        </div>
        <div id="auth-box" class="auth-box">
          <!-- popolato da JS: form login OPPURE saluto + logout -->
        </div>
      </div>
    </header>

    <main class="container">

      <section id="profilo-section" class="profilo-section" hidden>
        <h2>Il tuo profilo</h2>
        <div id="profilo" class="profilo">
          <!-- popolato da JS dopo login -->
        </div>
      </section>

      <section class="cerca-section">
        <h2>Cerca</h2>
        <div class="campo">
          <label for="cerca">Cerca su Open Library</label>
          <input type="text" id="cerca" placeholder="es. harari, tolkien...">
        </div>
        <div id="spinner" class="spinner" hidden>Caricamento in corso...</div>
        <div id="errore" class="alert alert-danger" hidden></div>
        <ul id="risultati" class="risultati"></ul>
      </section>

      <section class="form-section">
        <h2>Aggiungi un libro</h2>
        <form id="aggiungi-libro" class="form">

          <div class="campo">
            <label for="titolo">Titolo</label>
            <input type="text" id="titolo" name="titolo" required>
          </div>

          <div class="campo">
            <label for="autore">Autore</label>
            <input type="text" id="autore" name="autore" required>
          </div>

          <div class="campo">
            <label for="anno">Anno</label>
            <input type="number" id="anno" name="anno" min="0" max="2100" required>
          </div>

          <div class="campo">
            <label for="formato">Formato</label>
            <select id="formato" name="formato">
              <option value="cartaceo">Cartaceo</option>
              <option value="digitale">Digitale</option>
            </select>
          </div>

          <div class="campo campo-condizionale" id="campo-dimensione" hidden>
            <label for="dimensione">Dimensione (MB)</label>
            <input type="number" id="dimensione" name="dimensione" step="0.1" min="0">
          </div>

          <button type="submit" class="btn-primary">Aggiungi</button>
        </form>
      </section>

      <section class="lista-section">
        <div class="lista-header">
          <h2>I tuoi libri (<span id="contatore" aria-live="polite">0</span>)</h2>
          <button type="button" id="svuota-tutto" class="btn-svuota">Svuota tutto</button>
        </div>
        <p class="info-storage">I libri sono salvati nel browser e sopravvivono al refresh.</p>
        <ul id="lista-libri" class="lista-libri">
          <!-- popolato da JavaScript -->
        </ul>
      </section>

    </main>

    <!-- type="module": scope per file, strict mode, caricamento differito.
         Serve un server (Live Server): da file:// il browser blocca i moduli. -->
    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
